# Key bind
# prefix keyをCtrl+tに変更
set -g prefix C-t
unbind C-b
bind C-t send-prefix

# viのキーバインドを使用する
setw -g mode-keys vi

# vimのキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vimのキーバインドでwindowを移動する
bind -r C-h select-window -t :-
bind -r C-j select-window -t :+
bind -r C-k select-window -t :-
bind -r C-l select-window -t :+

# vimのキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vimのキーバインドでコピーする
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection
bind -T copy-mode-vi Y   send -X copy-line

# escape keyのdelayを無くす
set -sg escape-time 0

# 画面分割
unbind %
unbind '"'
bind | split-window -h
bind - split-window -v

# 複数ペイン同時操作
bind e setw synchronize-panes

# マウス操作を有効にする
set -g mouse on

# ペインのインデックスを1から始める
set -g base-index 1
setw -g pane-base-index 1

# command icons
%hidden ICON='#{E:##{@#{pane_current_command}-icon#}}'
set -g @command-icon "#{?${ICON},${ICON} ,}"

## commands
#set -g @zsh-icon 'T.B.D.'
set -g @nvim-icon '📝'

## AI Agent
set -g @codex-icon '🤖'
set -g @claude-icon '✳️'
set -g @copilot-icon '🐙'
set -g @antigravity-icon '🚀'

# status bar
set -g status off
set -g status-left-length 30
set -g status-left "#[bg=black,fg=cyan] [#S]   "
set -g status-right-length 30
set -g status-right "#[bg=black,fg=green] [%Y/%m/%d %H:%M:%S]"
set -g status-interval 1
set -g status-justify "left"

# side status
set -g side-status left
set -g side-status-width 24
set -g @side-window '#[acs]#{?window_end_flag,mq,tq}#[noacs]#{E:@command-icon}#W'
set -g @side-current-window '#[list=focus #{E:window-status-current-style}]#{E:@side-window}#[default list=on]'
set -g side-status-format '#[list=on]#{S:#S#[nl]#{W:#{E:@side-window}#[nl],#{?#{==:#{session_name},#{client_session}},#{E:@side-current-window},#{E:@side-window}}#[nl]}}'

# window settings
set -g automatic-rename on
set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W"

set -g history-limit 10000

# Color
# True Colorを使用可能にする
set -g default-terminal "tmux-256color"
set -ga terminal-features ",alacritty:RGB:Ss=\\E[%p1%d q:Se=\\E[2 q"

# ステータスバー
set -g status-style fg=colour015,bg=black

# アクティブなウィンドウを目立たせる
setw -g window-status-current-style fg=colour015,bg=magenta,bright

# ペインボーダーの色を設定する
set -g pane-border-style fg=black,bg=black

# アクティブなペインを目立たせる
set -g pane-active-border-style fg=magenta,bg=magenta

# for vim
set -g focus-events on

# 設定ファイルをリロードする
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
